version: 1
name: knobs-demo
knobs:
  pad: 8
  intent: default
  label: Hello
children:
  - name: Card
    type: frame
    layout: vertical
    padding: $pad
    fill: var:card
    children:
      - name: Title
        type: text
        content: "{{intent}} / $label"
        fontSize: 16
        fill: var:card-foreground
