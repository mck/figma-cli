version: 1
name: kitchen-sink
knobs:
  pagePad: 24
  sectionGap: 40
  radius: 10
modes:
  theme: default
  colorMode: light
children:
  - name: kitchen-sink
    type: frame
    layout: vertical
    width: 1440
    fill: var:background
    padding: [0, 0, 112, 0]
    children:
      - name: Header
        type: frame
        layout: vertical
        width: fill
        padding: 24
        stroke: var:border
        strokeWidth: 1
        children:
          - name: Title
            type: text
            content: shadcn-demo-app
            fontSize: 24
            fontWeight: 700
            fill: var:foreground
          - name: Subtitle
            type: text
            content: Kitchen-sink demo. Every color on this page comes from CSS variables set by the Tokens Studio export - none are hardcoded.
            fontSize: 14
            fill: var:muted-foreground

      - name: Main
        type: frame
        layout: vertical
        width: 1024
        gap: $sectionGap
        padding: [32, 24, 32, 24]
        children:

          - name: Buttons
            type: frame
            layout: vertical
            gap: 16
            width: fill
            children:
              - name: Buttons heading
                type: text
                content: Button
                fontSize: 20
                fontWeight: 600
                fill: var:foreground
              - name: Buttons card
                type: frame
                layout: wrap-horizontal
                gap: 12
                padding: 24
                radius: $radius
                fill: var:card
                stroke: var:border
                strokeWidth: 1
                children:
                  - { name: Btn Default, type: frame, layout: horizontal, align: center, justify: center, padding: [8, 16], radius: 10, fill: "var:primary", children: [{ name: t, type: text, content: Default, fontSize: 14, fontWeight: 500, fill: "var:primary-foreground" }] }
                  - { name: Btn Secondary, type: frame, layout: horizontal, align: center, justify: center, padding: [8, 16], radius: 10, fill: "var:secondary", children: [{ name: t, type: text, content: Secondary, fontSize: 14, fontWeight: 500, fill: "var:secondary-foreground" }] }
                  - { name: Btn Destructive, type: frame, layout: horizontal, align: center, justify: center, padding: [8, 16], radius: 10, fill: "var:destructive", children: [{ name: t, type: text, content: Destructive, fontSize: 14, fontWeight: 500, fill: "var:destructive" }] }
                  - { name: Btn Outline, type: frame, layout: horizontal, align: center, justify: center, padding: [8, 16], radius: 10, fill: "var:background", stroke: "var:border", strokeWidth: 1, children: [{ name: t, type: text, content: Outline, fontSize: 14, fontWeight: 500, fill: "var:foreground" }] }
                  - { name: Btn Ghost, type: frame, layout: horizontal, align: center, justify: center, padding: [8, 16], radius: 10, children: [{ name: t, type: text, content: Ghost, fontSize: 14, fontWeight: 500, fill: "var:foreground" }] }
                  - { name: Btn Link, type: frame, layout: horizontal, align: center, justify: center, padding: [8, 16], children: [{ name: t, type: text, content: Link, fontSize: 14, fontWeight: 500, fill: "var:primary" }] }
                  - { name: Btn Small, type: frame, layout: horizontal, align: center, justify: center, padding: [4, 12], radius: 10, fill: "var:primary", children: [{ name: t, type: text, content: Small, fontSize: 12, fontWeight: 500, fill: "var:primary-foreground" }] }
                  - { name: Btn Large, type: frame, layout: horizontal, align: center, justify: center, padding: [12, 24], radius: 10, fill: "var:primary", children: [{ name: t, type: text, content: Large, fontSize: 16, fontWeight: 500, fill: "var:primary-foreground" }] }
                  - { name: Btn Disabled, type: frame, layout: horizontal, align: center, justify: center, padding: [8, 16], radius: 10, fill: "var:primary", opacity: 0.5, children: [{ name: t, type: text, content: Disabled, fontSize: 14, fontWeight: 500, fill: "var:primary-foreground" }] }

          - name: Form controls
            type: frame
            layout: vertical
            gap: 16
            width: fill
            children:
              - name: Form heading
                type: text
                content: Form controls
                fontSize: 20
                fontWeight: 600
                fill: var:foreground
              - name: Form card
                type: frame
                layout: horizontal
                gap: 24
                padding: 24
                radius: $radius
                fill: var:card
                stroke: var:border
                strokeWidth: 1
                children:
                  - name: Email field
                    type: frame
                    layout: vertical
                    gap: 8
                    width: fill
                    children:
                      - { name: Email label, type: text, content: Email, fontSize: 14, fill: "var:foreground" }
                      - { name: Email input, type: frame, layout: horizontal, padding: [8, 12], radius: 8, stroke: "var:border", strokeWidth: 1, fill: "var:background", width: fill, children: [{ name: ph, type: text, content: you@example.com, fontSize: 14, fill: "var:muted-foreground" }] }
                  - name: Role field
                    type: frame
                    layout: vertical
                    gap: 8
                    width: fill
                    children:
                      - { name: Role label, type: text, content: Role, fontSize: 14, fill: "var:foreground" }
                      - { name: Role select, type: frame, layout: horizontal, padding: [8, 12], radius: 8, stroke: "var:border", strokeWidth: 1, fill: "var:background", width: fill, children: [{ name: val, type: text, content: Editor, fontSize: 14, fill: "var:foreground" }] }

          - name: Badges
            type: frame
            layout: vertical
            gap: 16
            width: fill
            children:
              - name: Badges heading
                type: text
                content: Badge
                fontSize: 20
                fontWeight: 600
                fill: var:foreground
              - name: Badges card
                type: frame
                layout: wrap-horizontal
                gap: 12
                padding: 24
                radius: $radius
                fill: var:card
                stroke: var:border
                strokeWidth: 1
                children:
                  - { name: Badge Default, type: frame, layout: horizontal, padding: [2, 8], radius: 8, fill: "var:primary", children: [{ name: t, type: text, content: Default, fontSize: 12, fill: "var:primary-foreground" }] }
                  - { name: Badge Secondary, type: frame, layout: horizontal, padding: [2, 8], radius: 8, fill: "var:secondary", children: [{ name: t, type: text, content: Secondary, fontSize: 12, fill: "var:secondary-foreground" }] }
                  - { name: Badge Destructive, type: frame, layout: horizontal, padding: [2, 8], radius: 8, fill: "var:destructive", children: [{ name: t, type: text, content: Destructive, fontSize: 12, fill: "var:destructive" }] }
                  - { name: Badge Outline, type: frame, layout: horizontal, padding: [2, 8], radius: 8, stroke: "var:border", strokeWidth: 1, children: [{ name: t, type: text, content: Outline, fontSize: 12, fill: "var:foreground" }] }

          - name: Cards
            type: frame
            layout: vertical
            gap: 16
            width: fill
            children:
              - name: Cards heading
                type: text
                content: Card
                fontSize: 20
                fontWeight: 600
                fill: var:foreground
              - name: Cards row
                type: frame
                layout: horizontal
                gap: 16
                width: fill
                children:
                  - name: Team members
                    type: frame
                    layout: vertical
                    gap: 8
                    padding: 16
                    radius: $radius
                    fill: var:card
                    stroke: var:border
                    strokeWidth: 1
                    width: fill
                    children:
                      - { name: Team title, type: text, content: Team members, fontSize: 16, fontWeight: 600, fill: "var:card-foreground" }
                      - { name: Team desc, type: text, content: Invite people to your workspace., fontSize: 14, fill: "var:muted-foreground" }
                      - { name: Team body, type: text, content: A plain content card exercising card / card-foreground tokens., fontSize: 14, fill: "var:muted-foreground" }
                      - { name: Invite, type: frame, layout: horizontal, padding: [4, 12], radius: 10, fill: "var:primary", children: [{ name: t, type: text, content: Invite, fontSize: 12, fill: "var:primary-foreground" }] }
                  - name: Plan usage
                    type: frame
                    layout: vertical
                    gap: 8
                    padding: 16
                    radius: $radius
                    fill: var:card
                    stroke: var:border
                    strokeWidth: 1
                    width: fill
                    children:
                      - { name: Plan title, type: text, content: Plan usage, fontSize: 16, fontWeight: 600, fill: "var:card-foreground" }
                      - { name: Plan desc, type: text, content: You are on the Pro plan., fontSize: 14, fill: "var:muted-foreground" }
                      - { name: Plan body, type: text, content: 4 of 10 seats used., fontSize: 14, fill: "var:muted-foreground" }

          - name: Chart
            type: frame
            layout: vertical
            gap: 16
            width: fill
            children:
              - name: Chart heading
                type: text
                content: Chart
                fontSize: 20
                fontWeight: 600
                fill: var:foreground
              - name: Chart card
                type: frame
                layout: horizontal
                gap: 24
                padding: 24
                radius: $radius
                fill: var:card
                stroke: var:border
                strokeWidth: 1
                children:
                  - name: Swatches
                    type: frame
                    layout: horizontal
                    gap: 12
                    children:
                      - { name: chart-1, type: rect, width: 40, height: 40, radius: 6, fill: "var:chart-1", stroke: "var:border", strokeWidth: 1 }
                      - { name: chart-2, type: rect, width: 40, height: 40, radius: 6, fill: "var:chart-2", stroke: "var:border", strokeWidth: 1 }
                      - { name: chart-3, type: rect, width: 40, height: 40, radius: 6, fill: "var:chart-3", stroke: "var:border", strokeWidth: 1 }
                      - { name: chart-4, type: rect, width: 40, height: 40, radius: 6, fill: "var:chart-4", stroke: "var:border", strokeWidth: 1 }
                      - { name: chart-5, type: rect, width: 40, height: 40, radius: 6, fill: "var:chart-5", stroke: "var:border", strokeWidth: 1 }

          - name: Sidebar demo
            type: frame
            layout: vertical
            gap: 16
            width: fill
            children:
              - name: Sidebar heading
                type: text
                content: Sidebar
                fontSize: 20
                fontWeight: 600
                fill: var:foreground
              - name: Sidebar shell
                type: frame
                layout: horizontal
                height: 352
                width: fill
                clip: true
                radius: $radius
                stroke: var:border
                strokeWidth: 1
                children:
                  - name: Sidebar
                    type: frame
                    layout: vertical
                    width: 256
                    height: fill
                    fill: var:sidebar
                    padding: 8
                    gap: 8
                    children:
                      - { name: Sidebar brand, type: text, content: shadcn-demo-app, fontSize: 14, fontWeight: 600, fill: "var:sidebar-foreground" }
                      - { name: Nav Home, type: frame, layout: horizontal, gap: 8, padding: 8, radius: 6, children: [{ name: Home icon, type: icon, icon: "lucide:home", size: 16, fill: "var:sidebar-foreground" }, { name: Home label, type: text, content: Home, fontSize: 14, fill: "var:sidebar-foreground" }] }
                      - { name: Nav Dashboard, type: frame, layout: horizontal, gap: 8, padding: 8, radius: 6, fill: "var:sidebar-accent", children: [{ name: Dash icon, type: icon, icon: "lucide:layout-dashboard", size: 16, fill: "var:sidebar-accent-foreground" }, { name: Dash label, type: text, content: Dashboard, fontSize: 14, fontWeight: 500, fill: "var:sidebar-accent-foreground" }] }
                      - { name: Nav Team, type: frame, layout: horizontal, gap: 8, padding: 8, radius: 6, children: [{ name: Team icon, type: icon, icon: "lucide:users", size: 16, fill: "var:sidebar-foreground" }, { name: Team label, type: text, content: Team, fontSize: 14, fill: "var:sidebar-foreground" }] }
                      - { name: Nav Settings, type: frame, layout: horizontal, gap: 8, padding: 8, radius: 6, children: [{ name: Settings icon, type: icon, icon: "lucide:settings", size: 16, fill: "var:sidebar-foreground" }, { name: Settings label, type: text, content: Settings, fontSize: 14, fill: "var:sidebar-foreground" }] }
                  - name: Inset
                    type: frame
                    layout: vertical
                    width: fill
                    height: fill
                    fill: var:background
                    padding: 16
                    gap: 12
                    children:
                      - { name: Inset copy, type: text, content: This inset panel reads from the sidebar token set., fontSize: 14, fill: "var:muted-foreground" }
                      - { name: Active users, type: frame, layout: vertical, padding: 16, radius: 10, fill: "var:card", stroke: "var:border", strokeWidth: 1, children: [{ name: au title, type: text, content: Active users, fontSize: 14, fontWeight: 600, fill: "var:card-foreground" }, { name: au value, type: text, content: "1,204", fontSize: 24, fontWeight: 600, fill: "var:foreground" }] }

      - name: Theme switcher
        type: frame
        layout: horizontal
        align: center
        gap: 4
        padding: 4
        radius: 999
        fill: var:popover
        stroke: var:border
        strokeWidth: 1
        children:
          - { name: Default theme, type: frame, layout: horizontal, padding: [4, 12], radius: 999, fill: "var:primary", children: [{ name: t, type: text, content: Default, fontSize: 12, fill: "var:primary-foreground" }] }
          - { name: Cyberpunk, type: frame, layout: horizontal, padding: [4, 12], radius: 999, children: [{ name: t, type: text, content: Cyberpunk, fontSize: 12, fill: "var:popover-foreground" }] }
          - { name: Bubblegum, type: frame, layout: horizontal, padding: [4, 12], radius: 999, children: [{ name: t, type: text, content: Bubblegum, fontSize: 12, fill: "var:popover-foreground" }] }
          - { name: Cosmic night, type: frame, layout: horizontal, padding: [4, 12], radius: 999, children: [{ name: t, type: text, content: Cosmic night, fontSize: 12, fill: "var:popover-foreground" }] }
          - { name: Divider, type: rect, width: 1, height: 20, fill: "var:border" }
          - { name: Light, type: frame, layout: horizontal, padding: [4, 12], radius: 999, fill: "var:primary", children: [{ name: t, type: text, content: Light, fontSize: 12, fill: "var:primary-foreground" }] }
          - { name: Dark, type: frame, layout: horizontal, padding: [4, 12], radius: 999, children: [{ name: t, type: text, content: Dark, fontSize: 12, fill: "var:popover-foreground" }] }
